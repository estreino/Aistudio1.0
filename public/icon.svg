<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Fundo escuro com safe-zone compatível com maskable -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <!-- Borda sutil de isolamento -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Anel de pulso da saúde (Zona segura central) -->
  <g transform="translate(256, 256)" filter="url(#neonGlow)">
    <!-- Escudo / Círculo de Proteção Local-First -->
    <circle r="140" fill="none" stroke="url(#neonPulse)" stroke-width="8" stroke-dasharray="16 8" opacity="0.4" />
    <circle r="110" fill="#090a0f" stroke="#1e293b" stroke-width="4" />
    
    <!-- Linha de Pulso Vital / Frequência Cardíaca & Rotina -->
    <path d="M -85,0 L -45,0 L -25,-55 L 0,65 L 25,-40 L 45,20 L 60,0 L 85,0"
          fill="none"
          stroke="url(#neonPulse)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />
          
    <!-- Ponto de Status Ativo Local -->
    <circle cx="85" cy="0" r="7" fill="#10b981" />
    <circle cx="-85" cy="0" r="7" fill="#3b82f6" />
  </g>
</svg>
